name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk UltimatePlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UltimatePlayer-apk
          path: UltimatePlayer.apk
      - name: Publier l'APK (lien direct)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" UltimatePlayer.apk --title "Ultimate Player $V" --notes "Télécharge UltimatePlayer.apk et installe-le." --latest
