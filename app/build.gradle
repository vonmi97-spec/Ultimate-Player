plugins { id 'com.android.application' }
android {
    namespace 'com.vonmi.ultimateplayer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.vonmi.ultimateplayer'
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName '2.0'
    }
    signingConfigs {
        fixe {
            storeFile file('ultimate.keystore')
            storePassword 'ultimate123'
            keyAlias 'ultimate'
            keyPassword 'ultimate123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixe }
        release { minifyEnabled false; signingConfig signingConfigs.fixe }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
